name: Release Please

# Automated releases. Release Please watches conventional commits on main and
# maintains a release PR (version bump + CHANGELOG). Merging it creates the tag +
# GitHub Release; the build job then attaches a static linux/amd64 binary.
#
# Signet ships as a host binary via systemd (see the SERV deploy ticket), so
# there is no ghcr image — the release artifact is the binary itself.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# An in-progress release is never cancelled (SGNT-27). `build` tags, uploads a
# binary and dispatches a deploy; a run cancelled between those steps leaves a
# release nobody can install from.
#
# This is not a queue, and the distinction matters in a file about what does and
# does not get cut: GitHub holds at most one PENDING run per group, so of two
# pushes arriving while a release is in flight the first is dropped before it
# starts and only the second runs. Nothing is lost — release-please picks up
# every commit since the last release — and the old `push: main` trigger on
# ci.yml superseded that run too, with `cancel-in-progress: true`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── The gate (SGNT-27) ────────────────────────────────────────────────────
  #
  # v1.7.0 was tagged, built and published with assets from a commit whose `ci`
  # run failed. `Release Please` and `ci` were separate workflows triggered by
  # the same push with no dependency between them, so nothing consulted the
  # other's result and a red suite stopped neither a tag, a binary, a GitHub
  # Release, nor the `signet-released` dispatch that offers it for deployment.
  #
  # That mattered more here than it would in most repos: a broken release
  # reached the `signet-prod` approval gate wearing the same clothes as a good
  # one, because that gate shows an approver WHAT is being deployed and not
  # whether it built clean.
  #
  # Calling ci.yml rather than coordinating with it across workflows is
  # deliberate. `workflow_run` would have worked, but it runs in a context
  # detached from the commit that triggered it and reports a blocked release as
  # a run that never happened. As a `needs:` edge, the suite runs against
  # `github.sha` — the pushed commit, no head-sha subtleties — inside this run,
  # so "why was this release blocked" is answered by opening the release's own
  # run rather than by cross-referencing another workflow.
  ci:
    uses: ./.github/workflows/ci.yml

  # A red suite blocks the release; this is what says so out loud. `needs: ci`
  # alone would leave a failed run whose title is a test job — accurate, and not
  # the same as being told that a release was withheld and what to do about it.
  # A release that simply never appears is its own kind of invisible.
  blocked:
    needs: ci
    if: failure()
    runs-on: ubuntu-latest
    # It reads nothing and writes nothing but its own summary. The workflow-level
    # `contents: write` exists for release-please and the asset upload; a job that
    # only reports a refusal has no business holding it.
    permissions: {}
    steps:
      - name: Report the withheld release
        run: |
          {
            echo "## Release blocked — \`ci\` failed on this commit"
            echo
            echo "\`${GITHUB_SHA}\` did not pass the suite, so this run stopped before"
            echo "release-please. **No tag, no GitHub Release, no binary, and no"
            echo "\`signet-released\` dispatch** — construct-server was never offered a"
            echo "deploy, and the \`signet-prod\` approver will see nothing for this commit."
            echo
            echo "The release PR was also left un-updated: release-please did not run."
            echo
            echo "### Recovering"
            echo
            echo "Push the fix to \`main\`. That push runs this workflow again, and"
            echo "release-please picks up every commit since the last release —"
            echo "including the one blocked here — so the release is delayed, not lost."
            echo "No manual re-tagging, and nothing to clean up."
            echo
            echo "If the failure was a flake rather than a real defect, re-running this"
            echo "workflow is enough; prefer fixing the flake (see SGNT-26, which is how"
            echo "this gap was found)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Release blocked::ci failed on ${GITHUB_SHA} — no tag, no release, no deploy dispatch. See the run summary."
          exit 1

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Mint a short-lived installation token from our GitHub App so the
      # release PR is created by the App identity rather than the default
      # GITHUB_TOKEN. Events from GITHUB_TOKEN don't trigger other workflows
      # (GitHub's anti-recursion safeguard), so the release PR's required `ci`
      # checks would never run. An App-minted token is a real actor, so those
      # checks fire. Requires repo (or org) secrets RELEASE_BOT_APP_ID +
      # RELEASE_BOT_PRIVATE_KEY; the App needs Contents: write + Pull requests:
      # write on this repo. Matches the switchyard / lyceum / purser setup.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Manifest/config-file mode. `simple` is the right release-type (a Go
          # module with one root component, version tracked in the manifest and
          # stamped into the binary at build time via -ldflags). It lives in
          # release-please-config.json so we can also set `changelog-sections`
          # to surface chore/refactor/polish work in the release notes. The
          # action defaults to these filenames, but we name them explicitly.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When release-please cuts a release, build the static binary and attach it to
  # the GitHub Release as linux/amd64 + a sha256 checksum. (Switchyard pushes a
  # ghcr image here; Signet ships a host binary, so the artifact is the binary.)
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The tag release-please just created, NOT the run's HEAD.
      #
      # Those are the same commit in the ordinary case, and were always the same
      # commit before the workflow-level `concurrency` above existed, because
      # every push to main got its own release run. They can now differ: of two
      # pushes arriving while a release is in flight, the first is dropped
      # before it starts, so the release-PR merge can be cut by a later run
      # whose HEAD is a different commit. Nothing in this job would notice —
      # it would compile one commit, stamp its sha, and upload the result to a
      # tag pointing at another.
      #
      # Naming the tag makes the mismatch unrepresentable rather than unlikely:
      # this job builds what it uploads, by construction. Flagged as
      # pre-existing in the review on #42; fixed here because the concurrency
      # change above is what makes it reachable.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The ldflag stamps VERSION, not TAG (SGNT-38). `tag_name` is `v1.9.0` and
      # `version` is `1.9.0`; the daemon reported the former on /healthz, which
      # Switchyard's delivery reconciler reads and compares against other
      # versions with strict equality. Bare semver is the estate-wide form.
      #
      # TAG is gone from this step's env: nothing in the run block references it
      # any more, and the Attach step below declares its own.
      - name: Build linux/amd64
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # From the checkout, not from github.sha: the two can differ per the
          # Checkout step above, and the sha this stamps is the one /healthz
          # reports to Switchyard's delivery reconciler as what is running. A
          # sha naming a commit the binary was not built from is worse than
          # none, which is why version.Get() has an absent case at all.
          GIT_SHA="$(git rev-parse HEAD)"
          asset="signet-${VERSION}-linux-amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/Einlanzerous/signet/internal/version.Version=${VERSION} \
              -X github.com/Einlanzerous/signet/internal/version.Commit=${GIT_SHA}" \
            -o "${asset}" ./cmd/signet
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          gh release upload "${TAG}" \
            "signet-${VERSION}-linux-amd64" \
            "signet-${VERSION}-linux-amd64.sha256" \
            --clobber

      # Tell construct-server a release is ready to deploy (SGNT-12 → SERV-62).
      # Mint a short-lived token scoped to construct-server rather than keep a
      # PAT alive: the release bot App is already installed there with
      # Contents: write, which is what repository_dispatch needs. Same approach
      # as switchyard's release.yml, which moved off CONSTRUCT_DISPATCH_TOKEN
      # after that PAT kept expiring and 401'ing releases.
      - name: Mint construct-server dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: Einlanzerous
          repositories: construct-server

      # Ordering is load-bearing: this sits *after* the upload because the
      # receiver's first act is `gh release download`. Dispatching earlier would
      # race the deploy against a release that has no binary attached yet.
      - name: Notify construct-server
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: Einlanzerous/construct-server
          event-type: signet-released
          # tag_name, not version: the receiver validates ^v[0-9]+\.[0-9]+\.[0-9]+$
          # and downloads by tag, so it needs the leading v. `version` is bare.
          client-payload: '{"tag": "${{ needs.release-please.outputs.tag_name }}"}'
