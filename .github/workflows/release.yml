name: Release Please

# Automated releases. Release Please watches conventional commits on main and
# maintains a release PR (version bump + CHANGELOG). Merging it creates the tag +
# GitHub Release; the build job then attaches a static linux/amd64 binary.
#
# Signet ships as a host binary via systemd (see the SERV deploy ticket), so
# there is no ghcr image — the release artifact is the binary itself.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# An in-progress release is never cancelled (SGNT-27). `build` tags, uploads a
# binary and dispatches a deploy; a run cancelled between those steps leaves a
# release nobody can install from.
#
# This is not a queue, and the distinction matters in a file about what does and
# does not get cut: GitHub holds at most one PENDING run per group, so of two
# pushes arriving while a release is in flight the first is dropped before it
# starts and only the second runs. Nothing is lost — release-please picks up
# every commit since the last release — and the old `push: main` trigger on
# ci.yml superseded that run too, with `cancel-in-progress: true`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── The gate (SGNT-27) ────────────────────────────────────────────────────
  #
  # v1.7.0 was tagged, built and published with assets from a commit whose `ci`
  # run failed. `Release Please` and `ci` were separate workflows triggered by
  # the same push with no dependency between them, so nothing consulted the
  # other's result and a red suite stopped neither a tag, a binary, a GitHub
  # Release, nor the `signet-released` dispatch that offers it for deployment.
  #
  # That mattered more here than it would in most repos: a broken release
  # reached the `signet-prod` approval gate wearing the same clothes as a good
  # one, because that gate shows an approver WHAT is being deployed and not
  # whether it built clean.
  #
  # Calling ci.yml rather than coordinating with it across workflows is
  # deliberate. `workflow_run` would have worked, but it runs in a context
  # detached from the commit that triggered it and reports a blocked release as
  # a run that never happened. As a `needs:` edge, the suite runs against
  # `github.sha` — the pushed commit, no head-sha subtleties — inside this run,
  # so "why was this release blocked" is answered by opening the release's own
  # run rather than by cross-referencing another workflow.
  ci:
    uses: ./.github/workflows/ci.yml

  # A red suite blocks the release; this is what says so out loud. `needs: ci`
  # alone would leave a failed run whose title is a test job — accurate, and not
  # the same as being told that a release was withheld and what to do about it.
  # A release that simply never appears is its own kind of invisible.
  blocked:
    needs: ci
    if: failure()
    runs-on: ubuntu-latest
    # It reads nothing and writes nothing but its own summary. The workflow-level
    # `contents: write` exists for release-please and the asset upload; a job that
    # only reports a refusal has no business holding it.
    permissions: {}
    steps:
      - name: Report the withheld release
        run: |
          {
            echo "## Release blocked — \`ci\` failed on this commit"
            echo
            echo "\`${GITHUB_SHA}\` did not pass the suite, so this run stopped before"
            echo "release-please. **No tag, no GitHub Release, no binary, and no"
            echo "\`signet-released\` dispatch** — construct-server was never offered a"
            echo "deploy, and the \`signet-prod\` approver will see nothing for this commit."
            echo
            echo "The release PR was also left un-updated: release-please did not run."
            echo
            echo "### Recovering"
            echo
            echo "Push the fix to \`main\`. That push runs this workflow again, and"
            echo "release-please picks up every commit since the last release —"
            echo "including the one blocked here — so the release is delayed, not lost."
            echo "No manual re-tagging, and nothing to clean up."
            echo
            echo "If the failure was a flake rather than a real defect, re-running this"
            echo "workflow is enough; prefer fixing the flake (see SGNT-26, which is how"
            echo "this gap was found)."
            echo
            echo "> One exception, if the commit blocked here was a **release-PR merge**."
            echo "> release-please tags that merge commit, not your fix, so a later run"
            echo "> will cut the release at this same red commit. \`verify-tag\` re-runs"
            echo "> the suite against the tag and will withhold the binary if it is still"
            echo "> failing — see that job's summary for what to do then. Re-running this"
            echo "> workflow, rather than pushing past it, is the cleaner recovery."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Release blocked::ci failed on ${GITHUB_SHA} — no tag, no release, no deploy dispatch. See the run summary."
          exit 1

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Mint a short-lived installation token from our GitHub App so the
      # release PR is created by the App identity rather than the default
      # GITHUB_TOKEN. Events from GITHUB_TOKEN don't trigger other workflows
      # (GitHub's anti-recursion safeguard), so the release PR's required `ci`
      # checks would never run. An App-minted token is a real actor, so those
      # checks fire. Requires repo (or org) secrets RELEASE_BOT_APP_ID +
      # RELEASE_BOT_PRIVATE_KEY; the App needs Contents: write + Pull requests:
      # write on this repo. Matches the switchyard / lyceum / purser setup.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Manifest/config-file mode. `simple` is the right release-type (a Go
          # module with one root component, version tracked in the manifest and
          # stamped into the binary at build time via -ldflags). It lives in
          # release-please-config.json so we can also set `changelog-sections`
          # to surface chore/refactor/polish work in the release notes. The
          # action defaults to these filenames, but we name them explicitly.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Gating the commit that is actually published (SGNT-27, round 2) ───────
  #
  # The `ci` job above gates release-please: it runs on `github.sha`, the pushed
  # commit, and stops a release being cut while main is red. That is not the
  # same as gating what gets SHIPPED, because the tag release-please creates
  # does not have to be the pushed commit.
  #
  # release-please ties a release to the release PR, and tags that PR's MERGE
  # COMMIT. Every tag in this repo points at one (`v1.9.1`→`e0e6bd4`,
  # `v1.9.0`→`4fc5f14`, …), and until this workflow gained a `concurrency` block
  # that always coincided with the run's HEAD, because every push to main got
  # its own run. It no longer has to:
  #
  #   1. release PR merges as M; M's run fails `ci`; `blocked` fires, no tag.
  #   2. the operator does what `blocked` says and pushes the fix, F.
  #   3. F's run passes `ci` — on F — and release-please cuts the release at M.
  #   4. `build` checks out the tag, which is M. Whose suite was red.
  #
  # The gate ran on F and the binary came from M. That is this ticket's own
  # title, re-created one job along, and it was introduced by round 2's fix for
  # a different problem: before it, `build` compiled `github.sha` and uploaded
  # to the tag, so the artifact was gated but possibly MISLABELLED. Trading that
  # for possibly UNGATED is the worse half, because a mislabelled binary is
  # visible in /healthz and an ungated one is visible nowhere.
  #
  # So the suite runs again, against the tag. This is deliberately not an
  # argument about what release-please targets: if the tag is always the pushed
  # commit then this job is a cheap no-op, and if it is not then this job is the
  # only thing standing between a red commit and construct-server. It is correct
  # under both readings, which is why it is here rather than a comment claiming
  # the question is settled.
  verify-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  # The same refusal as `blocked`, for the case where the tag exists. It is a
  # different fact and a different recovery — there is a tag and a GitHub
  # Release out there — so it says so rather than reusing the other wording.
  tag-unverified:
    needs: [release-please, verify-tag]
    # Narrower than `failure()`, which is true when ANY ancestor failed — that
    # includes the `ci` job, whose failure `blocked` already reports and which
    # leaves no tag for this summary to be about. Naming the result keeps the
    # two refusals describing the state they actually happened in.
    if: ${{ always() && needs.verify-tag.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report the withheld artifact
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "## Release \`${TAG}\` was tagged, and its binary is withheld"
            echo
            echo "The suite failed when run against \`${TAG}\` itself, which is not"
            echo "necessarily the commit this run was triggered by — release-please tags"
            echo "the release PR's merge commit."
            echo
            echo "**No binary was attached and no \`signet-released\` dispatch was sent**,"
            echo "so construct-server was never offered this release and the"
            echo "\`signet-prod\` approver will see nothing."
            echo
            echo "### Recovering"
            echo
            echo "The tag and the GitHub Release exist and are empty. This is the one"
            echo "case that needs a decision rather than a retry:"
            echo
            echo "- **A flake** — use **Re-run failed jobs** on THIS run. Not \"Re-run all"
            echo "  jobs\": that re-runs release-please, which will not release the same PR"
            echo "  twice (it is already \`autorelease: tagged\`), so \`release_created\`"
            echo "  comes back empty, every job below it skips, and the run goes green"
            echo "  having attached nothing. Re-running only the failed jobs preserves"
            echo "  release-please's outputs, so \`verify-tag\` and \`build\` see a real tag."
            echo "- **A real failure** — the tagged commit should not ship. Fix forward"
            echo "  and cut a new version, AND delete this tag and its Release. Pushing a"
            echo "  fix alone does not move this tag, and cutting a newer version does not"
            echo "  make this one installable — it stays published with nothing in it."
            echo
            echo "Until one of those happens, the \`orphan-release\` job fails on every"
            echo "later run of this workflow — including after a newer release — so an"
            echo "empty release cannot go quiet."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Binary withheld::the suite failed against ${TAG} — tag exists, no binary, no deploy dispatch. See the run summary."
          exit 1

  # ── The orphan check (SGNT-27, rounds 3-4) ───────────────────────────────
  #
  # `tag-unverified` refuses loudly, but only in the run that created the tag.
  # The state it leaves behind — a published Release with no binary — was
  # invisible afterwards, and the recovery this workflow used to document made
  # that worse: "re-run the workflow" means Re-run ALL jobs, which re-runs
  # release-please, which will not release the same PR twice.
  #
  # release-please only considers merged PRs still carrying `autorelease:
  # pending`, and swaps that for `autorelease: tagged` the moment it creates the
  # release — which already happened. So `release_created` and `tag_name` are
  # never set on the retry, `verify-tag` and `build` skip on an empty `if:`,
  # `tag-unverified` sees `skipped` rather than `failure`, and the run the docs
  # sent the operator to goes GREEN having done nothing. A path that returns
  # success because nothing explicitly failed, on the recovery path for the
  # state this workflow added.
  #
  # So this checks EVERY published release, not the version in the manifest.
  # Round 4 caught that scoping it to the manifest gave the alarm a third way to
  # stop: cutting the next release moves the check off the orphan, so an
  # operator who fixed forward without deleting — which the docs called optional
  # — silenced it while the empty release stayed installable. Whatever is
  # published has to hold a binary, for as long as it is published.
  #
  # It cannot cry wolf. It is skipped entirely on the run that cuts a release,
  # so it never races `build`; drafts are excluded; and all 15 releases in this
  # repo's history carry their assets, so there is no legacy state for it to
  # trip over.
  orphan-release:
    needs: [ci, release-please]
    if: ${{ always() && needs.release-please.result == 'success' && !needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse while any published release has no binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One paginated call returning exactly the offenders. A draft is not
          # installable and is excluded; a prerelease is, and is not.
          orphans="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft | not) | select(.assets | length == 0) | .tag_name')"
          if [ -z "${orphans}" ]; then
            echo "every published release carries at least one asset"
            exit 0
          fi
          {
            echo "## Published release(s) with no binary"
            echo
            echo '```'
            echo "${orphans}"
            echo '```'
            echo
            echo "A previous run tagged these and withheld the artifact — see that run's"
            echo "\`tag-unverified\` job. Nothing has attached one since, so"
            echo "construct-server was never offered them and anyone installing by tag"
            echo "gets a release with nothing in it."
            echo
            echo "This job will keep failing on every run until each is resolved. It"
            echo "reports an existing condition; it is not a fault in this run's commit."
            echo
            echo "### Resolving, per release"
            echo
            echo "- **The tagged commit is good** (the earlier failure was a flake) — go to"
            echo "  the run that cut it and use **Re-run failed jobs**, not Re-run all jobs."
            echo "  That preserves release-please's outputs so \`verify-tag\` and \`build\`"
            echo "  see a real tag; a full re-run releases nothing, because the release PR"
            echo "  is already \`autorelease: tagged\`."
            echo "- **The tagged commit is bad** — delete the tag and its Release, and cut a"
            echo "  new version. That commit should not ship, and leaving the empty release"
            echo "  published keeps this job red."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Release with no binary::$(echo "${orphans}" | tr '\n' ' ')— see the run summary."
          exit 1

  # When release-please cuts a release, build the static binary and attach it to
  # the GitHub Release as linux/amd64 + a sha256 checksum. (Switchyard pushes a
  # ghcr image here; Signet ships a host binary, so the artifact is the binary.)
  build:
    needs: [release-please, verify-tag]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The tag release-please just created, NOT the run's HEAD — so this job
      # builds what it uploads, by construction, rather than compiling one
      # commit and attaching the result to a tag pointing at another.
      #
      # This is only safe because `verify-tag` ran the suite against the same
      # ref. Pinning the artifact to the tag WITHOUT that gate is strictly worse
      # than not pinning it: see the comment on verify-tag for how it moved this
      # job from "gated but possibly mislabelled" to "correctly labelled but
      # possibly ungated". The two changes belong together and neither should be
      # reverted alone.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The ldflag stamps VERSION, not TAG (SGNT-38). `tag_name` is `v1.9.0` and
      # `version` is `1.9.0`; the daemon reported the former on /healthz, which
      # Switchyard's delivery reconciler reads and compares against other
      # versions with strict equality. Bare semver is the estate-wide form.
      #
      # TAG is gone from this step's env: nothing in the run block references it
      # any more, and the Attach step below declares its own.
      - name: Build linux/amd64
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # From the checkout, not from github.sha: the two can differ per the
          # Checkout step above, and the sha this stamps is the one /healthz
          # reports to Switchyard's delivery reconciler as what is running. A
          # sha naming a commit the binary was not built from is worse than
          # none, which is why version.Get() has an absent case at all.
          GIT_SHA="$(git rev-parse HEAD)"
          asset="signet-${VERSION}-linux-amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/Einlanzerous/signet/internal/version.Version=${VERSION} \
              -X github.com/Einlanzerous/signet/internal/version.Commit=${GIT_SHA}" \
            -o "${asset}" ./cmd/signet
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          gh release upload "${TAG}" \
            "signet-${VERSION}-linux-amd64" \
            "signet-${VERSION}-linux-amd64.sha256" \
            --clobber

      # Tell construct-server a release is ready to deploy (SGNT-12 → SERV-62).
      # Mint a short-lived token scoped to construct-server rather than keep a
      # PAT alive: the release bot App is already installed there with
      # Contents: write, which is what repository_dispatch needs. Same approach
      # as switchyard's release.yml, which moved off CONSTRUCT_DISPATCH_TOKEN
      # after that PAT kept expiring and 401'ing releases.
      - name: Mint construct-server dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: Einlanzerous
          repositories: construct-server

      # Ordering is load-bearing: this sits *after* the upload because the
      # receiver's first act is `gh release download`. Dispatching earlier would
      # race the deploy against a release that has no binary attached yet.
      - name: Notify construct-server
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: Einlanzerous/construct-server
          event-type: signet-released
          # tag_name, not version: the receiver validates ^v[0-9]+\.[0-9]+\.[0-9]+$
          # and downloads by tag, so it needs the leading v. `version` is bare.
          client-payload: '{"tag": "${{ needs.release-please.outputs.tag_name }}"}'
